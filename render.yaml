services:
  - type: web
    name: retrostudio-api
    runtime: python
    buildCommand: pip install --disable-pip-version-check -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_ALLOWED_ORIGINS
        sync: false
      - key: APP_ALLOWED_HOSTS
        sync: false
      - key: SUPABASE_URL
        value: https://gbnxvwglnwwsssqkcezy.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_INTERNAL_SIGNING_SECRET
        generateValue: true
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_EXPECTED_HOSTNAME
        sync: false
      - key: LIMITED_COMPATIBILITY_ENABLED
        value: "true"
      - key: AI_PROVIDER_API_KEY
        sync: false
  - type: web
    name: retrostudio-app
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm vite build
    staticPublishPath: ./dist/public
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        value: https://gbnxvwglnwwsssqkcezy.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
