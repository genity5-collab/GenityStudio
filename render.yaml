services:
  - type: web
    name: genitystudio
    runtime: python
    rootDir: retrostudio-secure
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: DEVICE_HASH_PEPPER
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ROBLOX_OPEN_CLOUD_API_KEY
        sync: false
      - key: AI_GEMINI_API_KEY
        sync: false
      - key: AI_OPENAI_API_KEY
        sync: false
      - key: AI_ANTHROPIC_API_KEY
        sync: false
      - key: AI_XAI_API_KEY
        sync: false
      - key: AI_QWEN_API_KEY
        sync: false
      - key: AI_MISTRAL_API_KEY
        sync: false
      - key: AI_MOONSHOT_API_KEY
        sync: false
      - key: AI_GROQ_API_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
